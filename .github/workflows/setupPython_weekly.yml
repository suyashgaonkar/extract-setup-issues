name: Weekly GitHub Issues Report

on:
  push:
    branches:
      - setup-actions
  # schedule:
  #   # Runs every Monday at 10:00 AM IST (i.e. 04:30 UTC)
  #   - cron: '30 4 * * 1'
  workflow_dispatch:

jobs:
  generate-issue-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Install dependencies
        run: |
          set -e
          python -m venv .venv
          source .venv/bin/activate
          pip install openpyxl requests pytz

      - name: Run issue report script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: actions
          REPO: setup-python
        run: |
          set -e
          source .venv/bin/activate
          python scripts/extract_issues_setup.py
        
      - name: 📤 Upload generated Excel file
        uses: actions/upload-artifact@v4
        with:
          name: github-issues-label-flags
          path: issues_setup_python.xlsx
